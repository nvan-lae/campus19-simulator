server {
    listen 80;

    # ── Frontend (Vite dev server over HTTPS) ──
    location / {
        proxy_pass https://frontend:5173;
        include /etc/nginx/proxy_headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Backend: Auth routes ──
    location /auth {
        proxy_pass https://backend:3000;
        include /etc/nginx/proxy_headers.conf;
    }

    # ── Backend: Users API ──
    location /users {
        proxy_pass https://backend:3000;
        include /etc/nginx/proxy_headers.conf;
    }

    # ── Backend: Games API ──
    location /games {
        proxy_pass https://backend:3000;
        include /etc/nginx/proxy_headers.conf;
    }

    # ── Backend: 2FA API ──
    location /api {
        proxy_pass https://backend:3000;
        include /etc/nginx/proxy_headers.conf;
    }

    # ── Backend: Uploads (static files) ──
    location /uploads {
        proxy_pass https://backend:3000;
        include /etc/nginx/proxy_headers.conf;
    }

    # ── Backend: WebSocket (Socket.IO) ──
    location /socket.io {
        proxy_pass https://backend:3000;
        include /etc/nginx/proxy_headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
