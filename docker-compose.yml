services:
  # 1. Database Service (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: transcendence_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - transcendence_network

  # 2. Backend Service (NestJS)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: transcendence_backend
    restart: on-failure
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for "Hot Reloading" during development
      - ./backend:/app/backend
      - ./shared:/app/shared
      - /app/backend/node_modules
      # Store user uploads in a named volume to avoid polluting the repo
      - uploads_data:/app/backend/uploads
    networks:
      - transcendence_network

  # 3. Frontend Service (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: transcendence_frontend
    restart: on-failure
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for "Hot Reloading"
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - /app/frontend/node_modules
      - ./backend/secrets:/app/frontend/secrets
    networks:
      - transcendence_network
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_URL=${VITE_API_URL}

# Define persistent storage for the DB
volumes:
  postgres_data:
  uploads_data:

# Define a shared network so containers can talk to each other
networks:
  transcendence_network:
    driver: bridge
