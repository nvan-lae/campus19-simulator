name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Lint
      working-directory: ./frontend
      run: npm run lint
    - name: Build
      working-directory: ./frontend
      run: npm run build
    - name: Set up key.pem
      run: |
      mkdir -p frontend/secrets
      echo "${{ secrets.KEY_PEM }}" > frontend/secrets/key.pem

  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    - name: Install dependencies
      working-directory: ./backend
      run: npm ci
    - name: Lint
      working-directory: ./backend
      run: npm run lint
    - name: Test
      working-directory: ./backend
      run: npm test
